name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore TableForTwo.sln

      - name: Build solution
        run: dotnet build TableForTwo.sln --no-restore

      - name: Run backend tests
        run: dotnet test tests/TableForTwo.API.Tests/TableForTwo.API.Tests.csproj --no-build

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: src/web

      - name: Lint web
        run: npm run lint
        working-directory: src/web

      - name: Build web
        run: npm run build
        working-directory: src/web
